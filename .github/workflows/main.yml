name: Construir ISO de LiteNova OS
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        working-directory: litenova-os-proyecto/litenova-os
    steps:
      - name: Instalar git y certificados
        run: apt-get update && apt-get install -y git ca-certificates
        working-directory: /
      - uses: actions/checkout@v4
      - name: Dar permisos a los scripts
        run: chmod +x build.sh auto/config config/hooks/normal/*
      - name: Construir ISO
        run: bash build.sh
      - name: Subir ISO
        uses: actions/upload-artifact@v4
        with:
          name: litenova-os-iso
          path: |
            litenova-os-proyecto/litenova-os/litenova-os-0.1-amd64.iso
            litenova-os-proyecto/litenova-os/SHA256SUMS
          retention-days: 7
          compression-level: 0
      - name: Subir registro (también si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-build
          path: |
            litenova-os-proyecto/litenova-os/build.log
            litenova-os-proyecto/litenova-os/build-skipped.txt
          if-no-files-found: ignore
